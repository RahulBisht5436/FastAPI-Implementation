[project]
name = "orm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahul bisht", email = "rahul.bisht@telgoo5.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "decouple>=0.0.7",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "openai>=3.13.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.14.0",
    "sqlalchemy~=2.0",
]

[project.scripts]
orm = "orm:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
