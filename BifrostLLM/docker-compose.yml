services:

  bifrost:
    image: maximhq/bifrost:latest
    container_name: bifrost
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - bifrost_data:/app/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


volumes:
  bifrost_data:
  qdrant_data: