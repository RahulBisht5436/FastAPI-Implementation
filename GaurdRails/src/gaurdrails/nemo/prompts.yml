prompts:
  - task: self_check_input
    content: |
      check if user is asking for the any detials of mia khalifa
      - if yes, block the message
      - if no, allow the message

      User message: "{{ user_input }}"
      Should this be blocked? Answer Yes or No.

  - task: self_check_output
    content: |
      Block the message if the bot response contains any of the following:
      - Details about mia khalifa
      - An email address (e.g. user@domain.com)
      - A phone number

      Bot response: "{{ bot_response }}"
      Should this be blocked? Answer Yes or No.

  