[project]
name = "ragas-eval"
version = "0.1.0"
description = "Production RAGAS evaluation service for personalChatBot"
readme = "README.md"
authors = [
    { name = "Rahul Bisht", email = "rahul.bisht@telgoo5.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=3.0.0",
    "httpx>=0.28.0",
    "langchain-community>=0.3.21,<0.4.0",
    "langchain-openai>=0.3.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "ragas>=0.2.14",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ragas-eval = "ragas_eval.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
