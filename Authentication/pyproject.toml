# Project metadata and dependency configuration (managed with uv).

[project]
name = "authentication"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahul bisht", email = "rahul.bisht@telgoo5.com" }
]
# Minimum Python version required to run this project
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",  # Web framework + uvicorn, pydantic, etc.
    "sqlmodel>=0.0.42",             # ORM + validation (SQLAlchemy + Pydantic)
    "unicorn>=2.1.4",
]

# CLI command: run `authentication` after install to invoke authentication:main
[project.scripts]
authentication = "authentication:main"

# Build tooling — uv_build packages the src/authentication module for install
[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
